#==============================================================================
# TERRAFORM MODULE VALIDATION
#==============================================================================

name: Terraform validation

#==============================================================================
# WORKFLOW TRIGGERS
#==============================================================================

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

#==============================================================================
# WORKFLOW PERMISSIONS AND CONCURRENCY
#==============================================================================

permissions:
  contents: read

concurrency:
  group: terraform-validation-${{ github.ref }}
  cancel-in-progress: true

#==============================================================================
# MODULE VALIDATION MATRIX
#==============================================================================

jobs:
  validate:
    name: Validate ${{ matrix.module }}
    strategy:
      fail-fast: false
      matrix:
        module:
          - budget-alert
          - compute-instance
          - identity-compartment
          - object-storage-bucket
          - vcn
    uses: bharathadigopula/github-pipeline-templates/.github/workflows/terraform-validate.yml@v0.1.0
    with:
      working_directory: ${{ matrix.module }}
    permissions:
      contents: read