#==============================================================================
# TERRAFORM MODULE VALIDATION
#==============================================================================

name: Terraform validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate ${{ matrix.module }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        module:
          - compute-instance
          - identity-compartment
          - object-storage-bucket
          - vcn

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: 1.10.5

      - name: Check formatting
        run: terraform -chdir=${{ matrix.module }} fmt -check -diff

      - name: Initialise module
        run: terraform -chdir=${{ matrix.module }} init -backend=false -input=false

      - name: Validate module
        run: terraform -chdir=${{ matrix.module }} validate -no-color