#==============================================================================
# TERRAFORM MODULE VALIDATION
#==============================================================================

name: Terraform validation

#==============================================================================
# WORKFLOW TRIGGERS
#==============================================================================

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

#==============================================================================
# WORKFLOW PERMISSIONS AND CONCURRENCY
#==============================================================================

permissions:
  contents: read

concurrency:
  group: terraform-validation-${{ github.ref }}
  cancel-in-progress: true

#==============================================================================
# MODULE VALIDATION MATRIX
#==============================================================================

jobs:
  validate:
    name: Validate ${{ matrix.module }}
    strategy:
      fail-fast: false
      matrix:
        module:
          - bastion
          - budget-alert
          - cloudflare-access-tunnel
          - compute-instance
          - core-network-security-group
          - core-network-security-group-security-rule
          - core-security-list
          - core-subnet
          - identity-dynamic-group
          - identity-compartment
          - identity-policy
          - kms-key
          - kms-vault
          - mysql-db-system
          - object-storage-bucket
          - random-password
          - vcn
          - vault-secret
    uses: bharathadigopula/github-pipeline-templates/.github/workflows/terraform-validate.yml@v0.8.10
    with:
      working_directory: ${{ matrix.module }}
    permissions:
      contents: read